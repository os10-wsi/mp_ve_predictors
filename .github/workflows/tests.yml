name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # The suite runs entirely offline against cached fixtures, so no model
      # weights and no network access are needed.
      - name: Tests
        run: python -m pytest -q

      - name: PREDICTORS.md is in sync
        run: |
          python scripts/generate_predictors_md.py
          git diff --exit-code PREDICTORS.md

      - name: Sign conventions
        run: python -m vepbench check-conventions

      - name: Shell scripts parse
        run: for f in scripts/*.sh envs/*/install.sh; do bash -n "$f"; done

      - name: Runner scripts compile
        run: python -m compileall -q scripts/runners

      - name: Lint
        run: ruff check vepbench scripts tests
